name: Sydes

# Validation of the Sydes runtime-evidence integration on Baserow #5507 (undo/redo
# PermissionDenied on restricted views). Sydes is installed from the integration
# branch commit with its uv.lock (diffgenome 0.1.0 from PyPI); macOS because
# DiffGenome 0.1.0 only runs target tests under sandbox-exec.

on:
  pull_request:
    branches: [ "sydes-test-base-5507" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  sydes:
    uses: sydes-examples/sydes-action/.github/workflows/verify.yml@runtime-evidence
    with:
      repo_alias: app
      model: openai:gpt-6.1-sol
      # Validating the runtime-evidence path; AI recovery alone takes 30-40+ min here.
      ai_recovery: false
      sydes_git_ref: d9b7080
      renderer_ref: runtime-evidence
      runner: macos-15
      # The repository's own test environment: its locked backend virtualenv
      # (outside the analyzed tree) and a local PostgreSQL.
      runtime_setup: |
        set -eux
        (cd backend && UV_PROJECT_ENVIRONMENT=/tmp/bw-venv uv sync --frozen --python 3.14)
        brew install postgresql@16
        PG="$(brew --prefix postgresql@16)/bin"
        "$PG/initdb" -D /tmp/pgdata -U postgres --auth=trust >/dev/null
        "$PG/pg_ctl" -D /tmp/pgdata -o "-p 55432 -k /tmp" -l /tmp/pg.log -w start
        "$PG/psql" -h 127.0.0.1 -p 55432 -U postgres \
          -c "CREATE ROLE baserow LOGIN SUPERUSER PASSWORD 'baserow'" \
          -c "CREATE DATABASE baserow OWNER baserow"
      # no --tests: Sydes selects the tests from the change (changed test files first,
      # then test files that call the changed functions)
      runtime_evidence_args: >-
        --runtime python --python /tmp/bw-venv/bin/python
        --source-root backend/src --test-root backend/tests
        --pythonpath backend/src --pythonpath premium/backend/src --pythonpath enterprise/backend/src
        --pythonpath backend/tests --pythonpath premium/backend/tests --pythonpath enterprise/backend/tests
        --pytest-arg='-p no:cacheprovider'
        --test-env DATABASE_HOST=127.0.0.1 --test-env DATABASE_PORT=55432
        --test-env DATABASE_USER=baserow --test-env DATABASE_PASSWORD=baserow
        --test-env DATABASE_NAME=baserow --allow-loopback
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
